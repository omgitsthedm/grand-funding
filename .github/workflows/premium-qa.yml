name: Production Premium Monitor

# Manual, read-only monitor for an already-published URL.
# Branch and pull-request artifacts are gated by ci.yml.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Published URL to audit'
        required: false
        default: 'https://www.grandfundingllc.com'
      watchlist_only:
        description: 'Watchlist-critical pages only (fast run)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: production-premium-monitor
  cancel-in-progress: true

jobs:
  premium-qa:
    name: Published Site Monitor
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Premium QA
        env:
          CI: 'true'
          BASE_URL: ${{ github.event.inputs.base_url || 'https://www.grandfundingllc.com' }}
          WATCHLIST_ONLY: ${{ github.event.inputs.watchlist_only == 'true' && '1' || '' }}
        run: |
          npm run test:premium

      - name: Upload QA report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report-${{ github.run_id }}
          path: scripts/qa-report.json
          retention-days: 30
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          echo "## Premium QA Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f scripts/qa-report.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            node -e "const r = JSON.parse(require('fs').readFileSync('scripts/qa-report.json')); console.log(JSON.stringify(r.summary, null, 2))" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "${{ job.status }}" = "failure" ]; then
              echo "### Failures by page/breakpoint" >> $GITHUB_STEP_SUMMARY
              echo '```json' >> $GITHUB_STEP_SUMMARY
              node -e "const r = JSON.parse(require('fs').readFileSync('scripts/qa-report.json')); console.log(JSON.stringify(r.failures, null, 2))" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "_No report generated — QA runner crashed._" >> $GITHUB_STEP_SUMMARY
          fi
