version: 1
project: grand-funding
updated: 2026-07-29

preservation_contract:
  brand:
    - desert-night background system
    - teal and ember accent system
    - DM Sans typography
    - original moving Arizona hero
    - original hero poster fallback
  experience:
    - direct access to Logan
    - funded-deal proof
    - project-cost and gross-spread calculator behavior
    - Netlify form names, actions, and no-JS POST fallback
  forbidden_without_client_approval:
    - rates, fees, points, loan amounts, leverage, or timing claims
    - occupancy, consumer-purpose, licensing, or service-area policy
    - credit thresholds, blanket documentation, prepayment, fixed-term, draw, or categorical fee policy
    - testimonials, funded-deal facts, or comparative superiority claims
    - production form submissions

commands:
  fast: npm run quality:fast
  full: npm run quality:full
  release: npm run quality:release
  live: BASE_URL=https://www.grandfundingllc.com npm run quality:live
  maintenance: npm run quality:maintenance

required_gates:
  fast:
    - deterministic build
    - public-boundary validation
    - technical SEO validation
    - public NMLS and MLO separation validation
    - client website approval validation
    - fail-closed public lending-policy validation
    - frozen regulated-claims baseline
    - quality-config validation
  full:
    - route crawl
    - original-experience preservation
    - accessibility
    - conversion and form resilience
    - Chromium, Firefox, and WebKit critical paths
    - premium watchlist
  release:
    - all full gates
    - strict regulated-claims approval
    - exact Netlify site identity

runtime:
  target_node: 24.18.0
  package_manager: npm
  publish_directory: dist
  browsers:
    - chromium
    - firefox
    - webkit

production:
  site_id: 055c5942-aeaa-478a-9508-a34406994d5d
  canonical_origin: https://www.grandfundingllc.com
  deploy_requires_explicit_user_authorization: true

performance_budgets:
  homepage_mobile:
    runs: 3
    performance_min: 85
    accessibility_min: 100
    best_practices_min: 100
    seo_min: 100
    first_contentful_paint_ms_max: 2700
    largest_contentful_paint_ms_max: 3800
    total_blocking_time_ms_max: 100
    cumulative_layout_shift_max: 0.05
  generated_delivery:
    stylesheets_per_html_page_max: 1
    inline_style_tags_max: 0
    duplicated_legacy_stylesheet_links_max: 0
    tracking_preconnects_before_consent_max: 0

evidence_boundaries:
  frozen_pending_provenance:
    - individual funded-deal amounts and closing details
    - testimonial identities and quotes
    - paid referral compensation language
  hostile_conditions:
    - JavaScript unavailable
    - reduced motion
    - save-data or constrained connection
    - backgrounded or restored tab
    - failed analytics and third-party requests
