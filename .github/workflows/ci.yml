name: Grand Funding QA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and validate public site
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser QA gates
        run: |
          npm run serve -- --dir dist --port 8888 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8888/ >/dev/null; then
              break
            fi
            sleep 1
          done
          BASE_URL=http://127.0.0.1:8888 WATCHLIST_ONLY=1 npm run test:premium
          BASE_URL=http://127.0.0.1:8888 npm run test:crawl
