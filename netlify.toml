[build]
  publish = "dist"
  command = "npm run quality:fast"

# Release-edge rules live in the publish directory, not here:
# - `_headers` is copied into `dist/_headers` by the build.
# - canonical, legacy, protected-file, and clean-route rules are generated into
#   `dist/_redirects` in first-match-safe order.
# This single source works identically for Git builds and exact Netlify Drop
# artifacts. Do not duplicate these rules in netlify.toml.
