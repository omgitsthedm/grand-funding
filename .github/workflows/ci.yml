name: Grand Funding Quality

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: grand-funding-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployable-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build and validate exact public artifact
        run: npm run quality:fast

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run preservation, accessibility, conversion, and browser gates
        env:
          CI: "true"
          QA_PORT: "8888"
        run: npm run test:browser

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: grand-funding-qa-${{ github.sha }}
          path: |
            artifacts/
          retention-days: 30
          if-no-files-found: ignore
