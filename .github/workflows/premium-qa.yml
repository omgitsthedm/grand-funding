name: Grand Funding Live Premium Audit

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: URL to audit
        required: true
        default: https://www.grandfundingllc.com
      watchlist_only:
        description: Audit only ranking-critical routes
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: grand-funding-live-premium
  cancel-in-progress: true

jobs:
  live-premium:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Audit requested live URL
        env:
          BASE_URL: ${{ inputs.base_url }}
          CI: "true"
          WATCHLIST_ONLY: ${{ inputs.watchlist_only && '1' || '' }}
        run: npm run test:premium

      - name: Upload premium report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-premium-${{ github.run_id }}
          path: artifacts/qa-premium-report.json
          retention-days: 30
          if-no-files-found: warn
